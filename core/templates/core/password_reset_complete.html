{% extends 'core/base_public.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center mt-4 mt-md-5">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="text-center mb-4">
            <img src="{% static 'images/backstage-pro-logo.png' %}"
                 alt="Backstage Pro"
                 class="img-fluid mb-2 mx-auto d-block"
                 style="max-height: 60px; max-width: 240px; width: auto; height: auto; object-fit: contain;"
                 onerror="this.onerror=null; this.src='{% static 'core/pwa/icons/backstage-icon-192.png' %}';">
        </div>
        
        <div class="card p-3 p-sm-4 shadow-sm border-0 text-center" style="border-radius: 16px;">
            <div class="card-body p-2 p-sm-3">
                <div class="mb-3 text-success">
                    <span class="rounded-circle d-inline-flex justify-content-center align-items-center bg-success bg-opacity-10 text-success" style="width: 64px; height: 64px; font-size: 28px;">
                        <i class="fa-solid fa-circle-check"></i>
                    </span>
                </div>
                
                <h4 class="card-title mb-2 fw-bold text-dark" style="font-size: 20px;">
                    Senha alterada com sucesso!
                </h4>
                
                <p class="text-muted mb-4" style="font-size: 14px; line-height: 1.6;">
                    Sua nova senha já está ativa. Você pode acessar o Backstage Pro agora mesmo.
                </p>
                
                <a href="{% url 'central_login' %}" class="btn btn-primary w-100 fw-bold py-3 text-uppercase shadow-sm d-flex align-items-center justify-content-center" style="border-radius: 8px; font-size: 14px; letter-spacing: 0.5px;">
                    <span>Entrar no Backstage Pro</span>
                    <i class="fa-solid fa-arrow-right ms-2" style="font-size: 12px;"></i>
                </a>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted small mb-0" style="font-size: 12px;">
                &copy; Backstage Pro &bull; Plataforma para Artistas e Bandas
            </p>
        </div>
    </div>
</div>
{% endblock %}
