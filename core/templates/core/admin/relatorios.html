{% extends 'core/admin/base_admin.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold m-0"><i class="fa-solid fa-chart-line me-2 text-primary"></i> Relatórios</h4>
</div>

<div class="row">
    <!-- Relatório Financeiro SaaS -->
    <div class="col-md-4 col-sm-6 mb-4">
        <a href="{% url 'admin_painel:relatorio_financeiro' %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                    <div class="mb-3" style="font-size: 3rem;">
                        📊
                    </div>
                    <h5 class="fw-bold text-dark m-0">Financeiro</h5>
                </div>
            </div>
        </a>
    </div>

    <!-- Catálogo de Parceiros -->
    <div class="col-md-4 col-sm-6 mb-4">
        <a href="{% url 'admin_painel:parceiros' %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                    <div class="mb-3" style="font-size: 3rem;">
                        <i class="fa-solid fa-handshake" style="color: #0f7fb1;"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Parceiros</h5>
                </div>
            </div>
        </a>
    </div>

    <!-- Fale Conosco -->
    <div class="col-md-4 col-sm-6 mb-4">
        <a href="{% url 'admin_painel:support_list' %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium position-relative" style="border-radius: 12px;">
                {% if support_unread_count and support_unread_count > 0 %}
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 1rem; padding: 0.5rem 0.8rem;">
                    {{ support_unread_count }}
                </span>
                {% endif %}
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                    <div class="mb-3" style="font-size: 3rem;">
                        <i class="fa-solid fa-headset" style="color: #0f7fb1;"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Fale Conosco</h5>
                </div>
            </div>
        </a>
    </div>

    <!-- Web Push -->
    {% if user_has_admin_web_push_perm %}
    <div class="col-md-4 col-sm-6 mb-4">
        <a href="{% url 'admin_painel:admin_web_push_dashboard' %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                    <div class="mb-3" style="font-size: 3rem;">
                        <i class="fa-solid fa-bell" style="color: #0f7fb1;"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Web Push</h5>
                </div>
            </div>
        </a>
    </div>
    {% endif %}
</div>
<style>
    .card-hover-premium:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>
{% endblock %}
