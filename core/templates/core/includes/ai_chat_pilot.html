<style>
    .bp-chat-launcher {
        position: fixed; right: 24px; bottom: 24px; z-index: 1055;
        display: inline-flex; align-items: center; gap: 9px; padding: 9px 17px 9px 9px;
        border: 0; border-radius: 999px; background: #087da9; color: #fff;
        font-size: 14px; font-weight: 700; box-shadow: 0 8px 25px rgba(5,65,96,.25);
    }
    .bp-chat-launcher:hover, .bp-chat-launcher:focus-visible { background: #096b91; color: #fff; }
    .bp-chat-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.19); font-size: 17px; }
    .bp-chat-panel {
        position: fixed; right: 24px; bottom: 88px; z-index: 1055;
        display: flex; flex-direction: column; width: min(410px, calc(100vw - 32px));
        height: min(610px, calc(100dvh - 112px)); overflow: hidden;
        border: 1px solid #dbe6ee; border-radius: 18px; background: #fff;
        box-shadow: 0 18px 55px rgba(20,40,60,.23);
    }
    .bp-chat-panel[hidden] { display: none; }
    .bp-chat-header { display: flex; align-items: center; gap: 11px; padding: 15px 17px; color: #fff; background: #087da9; }
    .bp-chat-header .bp-chat-icon { flex: none; width: 38px; height: 38px; border-radius: 12px; }
    .bp-chat-title { flex: 1; min-width: 0; }
    .bp-chat-title strong { display: block; font-size: 15px; line-height: 1.3; }
    .bp-chat-title small { display: block; color: #ddf4fb; font-size: 11px; }
    .bp-chat-close { border: 0; background: transparent; color: #fff; padding: 7px; border-radius: 8px; }
    .bp-chat-close:hover, .bp-chat-close:focus-visible { background: rgba(255,255,255,.18); }
    .bp-chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; background: #f6f9fb; }
    .bp-chat-welcome { padding: 15px; border: 1px solid #e0eaf0; border-radius: 14px; background: #fff; font-size: 13px; color: #405263; }
    .bp-chat-welcome strong { display: block; color: #18384c; font-size: 15px; margin-bottom: 5px; }
    .bp-chat-welcome p { margin: 0 0 10px; line-height: 1.45; }
    .bp-chat-suggestions { display: flex; flex-wrap: wrap; gap: 7px; }
    .bp-chat-suggestion { border: 1px solid #afd9e8; border-radius: 999px; padding: 6px 9px; background: #eff9fc; color: #075d82; font-size: 12px; text-align: left; }
    .bp-chat-suggestion:hover { background: #dff2f8; }
    .bp-chat-message { display: flex; flex-direction: column; margin-top: 14px; }
    .bp-chat-message[data-role="user"] { align-items: flex-end; }
    .bp-chat-message[data-role="assistant"] { align-items: flex-start; }
    .bp-chat-label { color: #687a87; font-size: 11px; margin-bottom: 4px; }
    .bp-chat-bubble { max-width: 88%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.5; }
    .bp-chat-message[data-role="user"] .bp-chat-bubble { border-bottom-right-radius: 4px; background: #087da9; color: #fff; }
    .bp-chat-message[data-role="assistant"] .bp-chat-bubble { border: 1px solid #e1e9ed; border-bottom-left-radius: 4px; background: #fff; color: #253744; }
    .bp-chat-composer { padding: 12px 14px 14px; background: #fff; border-top: 1px solid #e8eef2; }
    .bp-chat-error { margin: 0 0 8px; font-size: 12px; color: #b42318; }
    .bp-chat-input-row { display: flex; align-items: flex-end; gap: 8px; }
    .bp-chat-input-row textarea { flex: 1; min-width: 0; max-height: 110px; min-height: 42px; resize: vertical; border-radius: 12px; font-size: 13px; }
    .bp-chat-send { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 12px; background: #087da9; color: #fff; }
    .bp-chat-send:hover, .bp-chat-send:focus-visible { background: #096b91; }
    .bp-chat-send:disabled { opacity: .6; }
    .bp-chat-note { margin: 7px 2px 0; color: #72818b; font-size: 10px; }
    @media (max-width: 575px) {
        .bp-chat-launcher { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); padding: 8px; }
        .bp-chat-launcher .bp-chat-icon { width: 40px; height: 40px; }
        .bp-chat-launcher-label { display: none; }
        .bp-chat-panel { inset: 0; width: 100%; height: 100dvh; border: 0; border-radius: 0; }
        .bp-chat-launcher[aria-expanded="true"] { display: none; }
        .bp-chat-composer { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    }
</style>
<button type="button" class="bp-chat-launcher" id="bpChatLauncher" aria-controls="bpChatPanel" aria-expanded="false" aria-label="Abrir Assistente Backstage Pro">
    <span class="bp-chat-icon"><i class="fa-solid fa-comments" aria-hidden="true"></i></span>
    <span class="bp-chat-launcher-label">Assistente IA</span>
</button>
<section class="bp-chat-panel" id="bpChatPanel" role="dialog" aria-modal="false" aria-labelledby="bpChatTitle" hidden>
    <header class="bp-chat-header">
        <span class="bp-chat-icon"><i class="fa-solid fa-comments" aria-hidden="true"></i></span>
        <span class="bp-chat-title"><strong id="bpChatTitle">Assistente Backstage Pro</strong><small>Ajuda para usar o sistema · piloto</small></span>
        <button type="button" class="bp-chat-close" id="bpChatClose" aria-label="Fechar assistente"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>
    <div class="bp-chat-messages" id="aiChatMessages" role="log" aria-live="polite" aria-label="Mensagens do assistente">
        <div class="bp-chat-welcome">
            <strong>Olá! Como posso ajudar?</strong>
            <p>Posso orientar pelos menus e abas do Backstage Pro e ajudar com textos de produção. Ainda não consulto dados dos shows ou da banda.</p>
            <div class="bp-chat-suggestions">
                <button type="button" class="bp-chat-suggestion" data-question="Como cadastro um show?">Cadastrar show</button>
                <button type="button" class="bp-chat-suggestion" data-question="Como ativo as notificações neste dispositivo?">Ativar notificações</button>
            </div>
        </div>
    </div>
    <form class="bp-chat-composer" id="aiChatForm" data-url="{% url 'ai_chat_pilot' band.slug %}">
        {% csrf_token %}
        <p class="bp-chat-error" id="aiChatError" role="alert" hidden></p>
        <label for="aiChatInput" class="visually-hidden">Sua mensagem</label>
        <div class="bp-chat-input-row">
            <textarea id="aiChatInput" class="form-control" maxlength="1000" rows="1" required placeholder="Escreva sua pergunta..."></textarea>
            <button id="aiChatSend" class="bp-chat-send" type="submit" aria-label="Enviar mensagem"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
        </div>
        <p class="bp-chat-note">O assistente pode errar. Evite enviar informações pessoais.</p>
    </form>
</section>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('aiChatForm');
    if (!form) return;
    const launcher = document.getElementById('bpChatLauncher');
    const panel = document.getElementById('bpChatPanel');
    const close = document.getElementById('bpChatClose');
    const input = document.getElementById('aiChatInput');
    const messages = document.getElementById('aiChatMessages');
    const error = document.getElementById('aiChatError');
    const send = document.getElementById('aiChatSend');
    const history = [];
    function openChat() {
        panel.hidden = false;
        launcher.setAttribute('aria-expanded', 'true');
        launcher.setAttribute('aria-label', 'Fechar Assistente Backstage Pro');
        input.focus();
    }
    function closeChat() {
        panel.hidden = true;
        launcher.setAttribute('aria-expanded', 'false');
        launcher.setAttribute('aria-label', 'Abrir Assistente Backstage Pro');
        launcher.focus();
    }
    launcher.addEventListener('click', () => panel.hidden ? openChat() : closeChat());
    close.addEventListener('click', closeChat);
    panel.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeChat(); });
    panel.querySelectorAll('[data-question]').forEach((button) => {
        button.addEventListener('click', () => { input.value = button.dataset.question; input.focus(); });
    });
    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            form.requestSubmit();
        }
    });
    function addMessage(role, content) {
        const row = document.createElement('div');
        row.className = 'bp-chat-message';
        row.dataset.role = role;
        const label = document.createElement('span');
        label.className = 'bp-chat-label';
        label.textContent = role === 'user' ? 'Você' : 'Assistente';
        const bubble = document.createElement('span');
        bubble.className = 'bp-chat-bubble';
        bubble.textContent = content;
        row.append(label, bubble);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
        return row;
    }
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || send.disabled) return;
        error.hidden = true;
        send.disabled = true;
        send.setAttribute('aria-busy', 'true');
        const sentRow = addMessage('user', message);
        input.value = '';
        try {
            const response = await fetch(form.dataset.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value },
                body: JSON.stringify({ message, history: history.slice(-6) }),
            });
            const data = await response.json();
            if (!response.ok || !data.answer) throw new Error(data.error || 'Não foi possível responder agora.');
            addMessage('assistant', data.answer);
            history.push({role: 'user', content: message}, {role: 'assistant', content: data.answer.slice(0, 1000)});
        } catch (exc) {
            sentRow.remove();
            error.textContent = exc.message || 'Não foi possível responder agora.';
            error.hidden = false;
            input.value = message;
        } finally {
            send.disabled = false;
            send.removeAttribute('aria-busy');
            input.focus();
        }
    });
});
</script>
