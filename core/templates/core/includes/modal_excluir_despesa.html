
<!-- Modal Excluir Despesa -->
<div class="modal fade text-start text-wrap" style="white-space: normal;" id="modalExcluirDespesa-{{receipt.id}}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-danger">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i> Confirmar Exclusão</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center py-4">
        <i class="bi bi-trash text-danger mb-3" style="font-size: 3rem;"></i>
        <h4 class="mb-3">Você tem certeza?</h4>
        <p class="text-muted mb-0">Deseja realmente excluir a despesa <strong>"{{ receipt.description }}"</strong> no valor de <strong>R$ {{ receipt.value }}</strong>?</p>
      </div>
      <div class="modal-footer justify-content-center bg-light">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
        <form method="post" action="{% url 'receipt_delete' band.slug receipt.id %}?next={{ request.resolver_match.url_name }}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger rounded-pill px-4">Sim, Excluir</button>
        </form>
      </div>
    </div>
  </div>
</div>
