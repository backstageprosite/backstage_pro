
<!-- Modal Editar Custo Equipe -->
<div class="modal fade text-start text-wrap" id="modalEditarCustoEquipe-{{cost.id}}" tabindex="-1" aria-hidden="true" style="white-space: normal;">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="fa-solid fa-pencil me-2"></i> Editar Custo com Equipe</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form method="post" action="{% url 'teamcost_edit' band.slug cost.id %}?next={{ request.resolver_match.url_name }}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Nome do Integrante</label>
                <input type="text" name="name" class="form-control" value="{{ cost.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Função</label>
                <input type="text" name="role" class="form-control" value="{{ cost.role|default_if_none:'' }}">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Valor (R$)</label>
                <input type="text" name="value" class="form-control money-mask" value="{{ cost.value|floatformat:'2g' }}" required>
            </div>
            <div class="text-end mt-2">
                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                    <i class="bi bi-check-circle me-1"></i> Atualizar Custo
                </button>
            </div>
        </form>
      </div>
    </div>
  </div>
</div>
