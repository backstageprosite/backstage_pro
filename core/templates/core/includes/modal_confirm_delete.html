<!-- Modal Universal de Confirmação de Exclusão -->
<div class="modal fade" id="modalConfirmDeleteUniversal" tabindex="-1" aria-labelledby="modalConfirmDeleteUniversalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 12px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold text-danger" id="modalConfirmDeleteUniversalLabel" style="font-size: 16px;">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-3 p-md-4 text-dark" style="white-space: normal; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; min-width: 0; font-size: 13px; line-height: 1.4;">
                <span id="modalConfirmDeleteUniversalMessage">
                    Tem certeza que deseja excluir <span id="modalConfirmDeleteUniversalItemType"></span><strong><span id="modalConfirmDeleteUniversalItemName"></span></strong>?
                </span>
                <br>
                <small class="text-muted" id="modalConfirmDeleteUniversalWarning" style="font-size: 12px;">Esta ação não pode ser desfeita.</small>
            </div>
            <div class="modal-footer border-top-0 pt-0 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-light border fw-bold rounded-pill px-3" data-bs-dismiss="modal" style="height: 34px; font-size: 13px;">Cancelar</button>
                <form method="post" id="modalConfirmDeleteUniversalForm" action="" class="d-inline m-0 p-0">
                    {% csrf_token %}
                    <div id="modalConfirmDeleteUniversalExtraFields"></div>
                    <button type="submit" id="modalConfirmDeleteUniversalSubmitBtn" class="btn btn-danger fw-bold rounded-pill px-3 shadow-sm" style="height: 34px; font-size: 13px;">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    function initUniversalDeleteModal() {
        const modalEl = document.getElementById('modalConfirmDeleteUniversal');
        if (!modalEl || modalEl.dataset.initialized === 'true') return;
        modalEl.dataset.initialized = 'true';

        modalEl.addEventListener('show.bs.modal', function(event) {
            const button = event.relatedTarget;
            if (!button) return;

            const customTitle = button.getAttribute('data-modal-title') || 'Confirmar Exclusão';
            const url = button.getAttribute('data-delete-url') || button.getAttribute('data-url') || '';
            const itemName = button.getAttribute('data-item-name') || button.getAttribute('data-name') || '';
            const itemType = button.getAttribute('data-item-type') || button.getAttribute('data-type') || '';
            const customMessage = button.getAttribute('data-custom-message') || '';
            const customWarning = button.getAttribute('data-custom-warning') || 'Esta ação não pode ser desfeita.';
            const btnText = button.getAttribute('data-delete-btn-text') || button.getAttribute('data-btn-text') || 'Excluir';
            const extraFieldsJson = button.getAttribute('data-extra-fields') || '';

            const titleEl = document.getElementById('modalConfirmDeleteUniversalLabel');
            const form = document.getElementById('modalConfirmDeleteUniversalForm');
            const nameEl = document.getElementById('modalConfirmDeleteUniversalItemName');
            const typeEl = document.getElementById('modalConfirmDeleteUniversalItemType');
            const msgEl = document.getElementById('modalConfirmDeleteUniversalMessage');
            const warnEl = document.getElementById('modalConfirmDeleteUniversalWarning');
            const submitBtn = document.getElementById('modalConfirmDeleteUniversalSubmitBtn');
            const extraFieldsContainer = document.getElementById('modalConfirmDeleteUniversalExtraFields');

            if (titleEl) titleEl.textContent = customTitle;
            if (form) form.action = url;
            if (submitBtn) submitBtn.textContent = btnText;
            if (warnEl) warnEl.textContent = customWarning;

            if (customMessage) {
                if (msgEl) msgEl.innerHTML = customMessage;
            } else {
                if (msgEl) {
                    msgEl.innerHTML = 'Tem certeza que deseja excluir ' +
                        (itemType ? (escapeHtml(itemType) + ' ') : '') +
                        '<strong>' + escapeHtml(itemName) + '</strong>?';
                }
            }

            if (extraFieldsContainer) {
                extraFieldsContainer.innerHTML = '';
                if (extraFieldsJson) {
                    try {
                        const fields = JSON.parse(extraFieldsJson);
                        Object.keys(fields).forEach(key => {
                            const input = document.createElement('input');
                            input.type = 'hidden';
                            input.name = key;
                            input.value = fields[key];
                            extraFieldsContainer.appendChild(input);
                        });
                    } catch (e) {
                        console.error('Erro ao processar extra-fields no modal universal:', e);
                    }
                }
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initUniversalDeleteModal);
    } else {
        initUniversalDeleteModal();
    }
})();
</script>
