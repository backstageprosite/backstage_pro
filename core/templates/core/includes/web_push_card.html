<h5 class="fw-bold mb-3 mt-4">Notificações</h5>

<div class="mb-4" id="web-push-settings-card" 
     data-public-key-url="{% url 'push_public_key' band.slug %}"
     data-status-url="{% url 'push_subscription_status' band.slug %}"
     data-subscribe-url="{% url 'push_subscribe' band.slug %}"
     data-unsubscribe-url="{% url 'push_unsubscribe' band.slug %}"
     data-band-slug="{{ band.slug }}"
     data-expected-scope="/{{ band.slug }}/">
     
     {% csrf_token %}
     
     <div class="d-flex align-items-center p-3 bg-light rounded border">
         <div class="me-3 text-primary">
             <i class="fa-solid fa-bell fs-2"></i>
         </div>
         <div class="flex-grow-1">
             <h6 class="fw-bold mb-1">Notificações neste dispositivo</h6>
             <p class="text-muted mb-2 small">Receba avisos de novos shows, alterações de data, horário e cancelamentos neste dispositivo.</p>
             
             <div aria-live="polite" id="web-push-feedback" class="small fw-medium mb-2 text-primary">
                 Verificando suporte...
             </div>
             
             <div class="d-flex gap-2">
                 <button type="button" id="web-push-btn-main" class="btn btn-sm btn-primary rounded-pill fw-bold" disabled>
                     <span class="spinner-border spinner-border-sm me-1 d-none" role="status" aria-hidden="true" id="web-push-spinner-main"></span>
                     <span id="web-push-btn-main-text">Aguarde...</span>
                 </button>
                 <button type="button" id="web-push-btn-secondary" class="btn btn-sm btn-outline-danger rounded-pill fw-bold d-none">
                     <span class="spinner-border spinner-border-sm me-1 d-none" role="status" aria-hidden="true" id="web-push-spinner-secondary"></span>
                     <span id="web-push-btn-secondary-text">Desativar neste dispositivo</span>
                 </button>
             </div>
         </div>
     </div>
</div>
