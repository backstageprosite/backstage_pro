{% if tipo == 'HOSPEDAGEM' %}
    <span class="contact-type-pill" style="background-color: #CFF4FC; border: 1px solid #9EEAF9; color: #212529;" aria-label="Hotel">
        <i class="fa-solid fa-hotel" aria-hidden="true" style="color: #212529;"></i> Hotel
    </span>
{% elif tipo == 'RESTAURANTE' %}
    <span class="contact-type-pill" style="background-color: #FFF3CD; border: 1px solid #FFE69C; color: #212529;" aria-label="Restaurante">
        <i class="fa-solid fa-utensils" aria-hidden="true" style="color: #212529;"></i> Restaurante
    </span>
{% elif tipo == 'ESTABELECIMENTO' %}
    <span class="contact-type-pill" style="background-color: #E2E3E5; border: 1px solid #C4C8CB; color: #212529;" aria-label="Empresa">
        <i class="fa-solid fa-building" aria-hidden="true" style="color: #212529;"></i> Empresa
    </span>
{% elif tipo == 'FORNECEDOR' %}
    <span class="contact-type-pill" style="background-color: #D1E7DD; border: 1px solid #A3CFBB; color: #212529;" aria-label="Fornecedor">
        <i class="fa-solid fa-truck" aria-hidden="true" style="color: #212529;"></i> Fornecedor
    </span>
{% elif tipo == 'PRODUTOR' %}
    <span class="contact-type-pill" style="background-color: #F8D7DA; border: 1px solid #F1AEB5; color: #212529;" aria-label="Produtor(a)">
        <i class="fa-solid fa-user-tie" aria-hidden="true" style="color: #212529;"></i> Produtor(a)
    </span>
{% elif tipo == 'CONTRATANTE' %}
    <span class="contact-type-pill" style="background-color: #F7D6E6; border: 1px solid #EFA8C8; color: #212529;" aria-label="Contratante">
        <i class="fa-solid fa-handshake" aria-hidden="true" style="color: #212529;"></i> Contratante
    </span>
{% else %}
    <span class="contact-type-pill bg-light border" style="color: #212529;" aria-label="{{ display }}">
        {{ display }}
    </span>
{% endif %}
