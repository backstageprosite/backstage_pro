{% extends 'core/base_public.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="text-center mb-4">
            {% if band and band.logo %}
                <img src="{% url 'public_band_logo' band.slug %}" alt="{{ band.name }}" class="img-fluid mb-3" style="max-height: 200px;">
            {% else %}
                <img src="{% static 'images/backstage-pro-logo.png' %}" alt="Backstage Pro" class="img-fluid mb-3" style="max-height: 50px;">
            {% endif %}
            <p class="text-muted mt-2">Recuperação de Senha</p>
        </div>
        
        <div class="card p-4">
            <div class="card-body">
                <h4 class="card-title text-center mb-3">Esqueci minha senha</h4>
                <p class="text-center text-muted small mb-4">
                    Solicite ao produtor para gerar uma nova senha de acesso ao seu painel.
                </p>
                
                <div class="text-center mt-4">
                    <a href="{% if request.GET.band %}{% url 'login' request.GET.band %}{% else %}/{% endif %}" class="text-decoration-none small">Voltar para o login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
