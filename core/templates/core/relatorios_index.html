{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <h4 class="fw-bold m-0"><i class="fa-solid fa-chart-line text-primary me-2"></i> Relatórios</h4>
</div>



<div class="row">
    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'relatorio_financeiro' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        📊
                    </div>
                    <h5 class="fw-bold text-dark m-0">Financeiro</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'usuarios_list' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        <i class="fa-solid fa-id-badge text-danger"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Usuários</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'arquivos' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        📁
                    </div>
                    <h5 class="fw-bold text-dark m-0">Arquivos</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'rider_list' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        🎸
                    </div>
                    <h5 class="fw-bold text-dark m-0">Rider</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'room_list_index' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        <i class="fa-solid fa-bed" style="color: #6c757d;"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Hospedagem</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'band_notices_index' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        <i class="fa-solid fa-bullhorn text-warning"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Avisos</h5>
                </div>
            </div>
        </a>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'integrantes_list' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        <i class="fa-solid fa-users-gear" style="color: #6BD443;"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Integrantes</h5>
                </div>
            </div>
        </a>
    </div>

    {% if subscription %}
    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'minha_assinatura' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        📝
                    </div>
                    <h5 class="fw-bold text-dark m-0">Assinatura</h5>
                </div>
            </div>
        </a>
    </div>
    {% endif %}

    {% if request.user.is_produtor %}
    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <a href="{% url 'support_list' band.slug %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 card-hover-premium" style="border-radius: 12px;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center py-4 position-relative">
                    <div class="mb-2" style="font-size: 2.2rem;">
                        <i class="fa-solid fa-headset" style="color: #0f7fb1;"></i>
                    </div>
                    <h5 class="fw-bold text-dark m-0">Fale Conosco</h5>
                </div>
            </div>
        </a>
    </div>
    {% endif %}
</div>
{% endblock %}
